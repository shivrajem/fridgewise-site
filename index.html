<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FridgeWise</title>
  <meta name="description" content="Track the vegetables you buy, see how much ends up in the bin, and get a shopping list sized to what you actually cook.">
  <meta name="theme-color" content="#1f7a4d" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1512" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FridgeWise">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar"><h1 id="title">FridgeWise</h1></header>

  <main id="view" tabindex="-1">
    <noscript><p class="empty">FridgeWise needs JavaScript turned on.</p></noscript>
  </main>

  <nav class="tabbar" aria-label="Main">
    <a href="#fridge" data-tab="fridge">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M5 9.5h14M8.5 5.5v2M8.5 12.5v4"/></svg>
      <span>Fridge</span>
      <span class="nav-badge" id="fridge-badge" hidden></span>
    </a>
    <a href="#add" data-tab="add" class="add-tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 7.5v9M7.5 12h9"/></svg>
      <span>Add</span>
    </a>
    <a href="#stats" data-tab="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 20.5h17M7 17V11M12 17V6M17 17v-4"/></svg>
      <span>Report</span>
    </a>
    <a href="#list" data-tab="list">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.5" cy="6.5" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="17.5" r="1"/></svg>
      <span>List</span>
    </a>
    <a href="#more" data-tab="more">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
      <span>Settings</span>
    </a>
  </nav>

  <dialog id="sheet" aria-label="Details"></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
</body>
</html>
